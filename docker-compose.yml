# One command brings the stack up: `docker compose up --build`.
#
# Deployment problems found in week 1 cost hours; the same problems found in week 7 cost the
# deadline (WEEKLY_PLAN.md Task 1.4). No Kubernetes — Open Issue 019.

name: quant-arena

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Durability is a Redis configuration now, not hand-written group commit (Open Issue 003).
    # AOF is off by default, so without this the stream is not durable at all.
    #
    # `appendfsync always` flushes on every write and would be far too slow one order at a
    # time; the gateway's StreamProducer pipelines concurrent appends into one command batch,
    # giving one fsync per batch. That is group commit, done by Redis. Measurements and the
    # reasoning are in benchmarks/results/2.1-stream-durability.md.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"          # exposed so the test suite can run on the host against this stack
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      # Overridable from the environment so the file never has to hold a real secret.
      # Task 3.3 handles secrets for the public deployment.
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:-quant}
      POSTGRES_DB: quant_arena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_arena"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    restart: unless-stopped
    # `service_healthy`, not `service_started`: the gateway creates its tables on startup, so a
    # PostgreSQL that is running but not yet accepting connections would fail the boot.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Infrastructure only. Every domain parameter comes from config/quant_arena.toml, which
      # is baked into the image and hashed into the startup log.
      QA_REDIS_URL: redis://redis:6379/0
      QA_DATABASE_URL: postgresql+psycopg://quant:${QA_POSTGRES_PASSWORD:-quant}@postgres:5432/quant_arena
      # A browser silently discards a Secure cookie over plain http, and the local stack is
      # http. Task 3.3 turns this back on behind TLS.
      QA_SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  matcher:
    build: .
    restart: unless-stopped
    # Its own process, not a thread in the gateway. The gateway is the single *producer* of
    # the inbound stream and must stay answerable to HTTP (Open Issue 007); matching is a
    # single-writer loop with no request attached to it, and coupling them would make a slow
    # match a slow API. Redis durability and recovery stay in Python; matching runs in C++.
    command: ["python", "-m", "services.matcher.cpp_runner"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # No QA_DATABASE_URL: the matcher never touches PostgreSQL. The engine is money-blind
      # (Open Issue 001) and the read model is the ledger's, not the matcher's.
      QA_REDIS_URL: redis://redis:6379/0
      QA_CPP_ENGINE_PATH: /usr/local/bin/quant-arena-engine
    # The matcher has no HTTP surface, so liveness is "the process is up and can still reach
    # the log it consumes". It deliberately does not assert that the matcher is *caught up* —
    # a container healthcheck cannot see the consumer's position, and a lag alarm belongs with
    # the benchmarks (Open Issue 012), not here.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,redis,sys; sys.exit(0 if redis.Redis.from_url(os.environ['QA_REDIS_URL']).ping() else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ledger:
    build: .
    restart: unless-stopped
    # The read-model projection: outbound stream in, PostgreSQL out. Its own process so that it
    # is the *single writer* of accounts, positions, open_orders and house_fees — which is what
    # Open Issue 004 means by PostgreSQL being a derived read model. Two writers and it would
    # not be derived from anything.
    command: ["python", "-m", "services.ledger"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Not decoration. The gateway is what runs `SQLModel.metadata.create_all`, so a ledger
      # that started first would replay the stream and then fail to write it into tables that
      # do not exist yet.
      gateway:
        condition: service_healthy
    environment:
      QA_REDIS_URL: redis://redis:6379/0
      QA_DATABASE_URL: postgresql+psycopg://quant:${QA_POSTGRES_PASSWORD:-quant}@postgres:5432/quant_arena
    # Like the matcher: no HTTP surface, so liveness is "the process is up and can still reach
    # the stores". Whether the projection is *caught up* is a lag question, and a lag alarm
    # belongs with the benchmarks (Open Issue 012), not in a container healthcheck.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,redis,sys; sys.exit(0 if redis.Redis.from_url(os.environ['QA_REDIS_URL']).ping() else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  fanout:
    build: .
    restart: unless-stopped
    # A separate process, and that is a settled decision rather than a deployment convenience:
    # Open Issue 006 sub-decision 7b says coupling fan-out to the sequencer degrades order
    # acknowledgement latency under connection load, and two hundred WebSocket connections is
    # exactly that load. Task 5.2's Boundaries repeat it.
    command: ["python", "-m", "services.fanout"]
    depends_on:
      redis:
        condition: service_healthy
      # The gateway, only for the halt key it publishes (`qa:halt`). Fan-out runs perfectly
      # well without it — an absent key reads as `gateway_unreachable`, which is true — but
      # starting after it means the browser is not shown a halt during a normal boot.
      gateway:
        condition: service_healthy
    environment:
      QA_REDIS_URL: redis://redis:6379/0
      # No QA_DATABASE_URL: fan-out derives everything from the stream and never reads the
      # PostgreSQL read model. Sessions are in Redis (Open Issue 015), so authentication needs
      # no database either.
    ports:
      - "8001:8001"
    # Unlike the matcher and the ledger, this one has an HTTP surface, so liveness is a real
    # question rather than "the process is up": /health carries the stream position and the
    # tick count, which is what says the feed is actually moving.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  archiver:
    build: .
    restart: unless-stopped
    # Outbound stream in, Parquet out (Task 6.2). Its own process for the same reason the matcher,
    # ledger and fan-out have one (Open Issue 007) — but unlike those three, its absence costs
    # nothing in Phase 1: the archive is not correctness-critical, because MAXLEN is sized so
    # replay never needs it (Open Issue 018 section 13.2). Nothing depends on this container, and
    # it depends on nothing but the log.
    command: ["python", "-m", "services.archiver"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # No QA_DATABASE_URL: bulk history does not go into PostgreSQL. That is the derived read
      # model (Open Issue 004), not a data warehouse, and 6.2's Boundaries say so directly.
      QA_REDIS_URL: redis://redis:6379/0
      # Infrastructure, not configuration: a path on a machine, so it is deliberately *not* in
      # the hashed TOML. A path inside config_hash would change the hash when nothing about the
      # configuration had.
      QA_ARCHIVE_DIR: /archive
    volumes:
      - archive:/archive
    # No HTTP surface, so liveness is "can still reach the log it consumes" — **and can still write
    # where it writes**. The second half is not decoration: the first run of this service failed
    # every `mkdir` against a root-owned volume and reported healthy throughout, because pinging
    # Redis says nothing about a process whose entire job is producing files. Whether the archive is
    # *caught up* is still a lag question and still belongs with the benchmarks (Open Issue 012).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,redis,sys; sys.exit(0 if redis.Redis.from_url(os.environ['QA_REDIS_URL']).ping() and os.access(os.environ['QA_ARCHIVE_DIR'], os.W_OK) else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bots:
    build: .
    restart: unless-stopped
    # Behind a profile, so it is off unless asked for:
    #
    #     docker compose --profile bots up
    #
    # A stack that always has a live market is what you want for a demonstration and the last
    # thing you want under a test suite — the bots trade continuously, so every assertion about
    # a book or a balance would be racing them. Making it a per-run choice rather than a
    # per-checkout one is the whole reason this is a profile and not a plain service.
    profiles: ["bots"]
    command: ["python", "-m", "services.bots"]
    depends_on:
      # The gateway, because the bots are HTTP clients of it (Task 4.4's Boundaries: through
      # the real API, never in process). The matcher, because a market order into a book
      # nothing is matching has no opposing side and is refused outright.
      gateway:
        condition: service_healthy
      matcher:
        condition: service_healthy
    environment:
      QA_GATEWAY_URL: http://gateway:8000
      # A secret, so it comes from the environment and never from the hashed configuration
      # file. There is deliberately no default: a password with a default is a password in the
      # repository the first time someone forgets to set it.
      #
      # Passed through empty rather than declared required with `:?`. Compose interpolates
      # every service's environment whether or not its profile is selected, so `:?` here made
      # `docker compose config` fail for the *default* stack — breaking the five-service
      # assertion in tests/config/test_compose.py and anyone running `docker compose up`
      # without bots. `services/bots/__main__.py` refuses to start without it, which is the
      # place that can say why.
      QA_BOT_PASSWORD: ${QA_BOT_PASSWORD:-}
    # No healthcheck. A bot has no surface to probe, and "the process is up" says nothing about
    # whether it is meeting its quoting obligations — which is measured and reported by the
    # obligation meter, not by Docker.

volumes:
  pgdata:
  redisdata:
  # The Parquet archive. A named volume rather than a bind mount: it is derived data that a
  # `docker compose down -v` is entitled to destroy, and it must not litter the checkout.
  archive:
