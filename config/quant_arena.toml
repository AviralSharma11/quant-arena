# Quant Arena — the shared configuration.
#
# ONE file, version controlled, read by every process. Its SHA-256 is stamped into each
# process's startup log, so a recorded session or a benchmark result is self-describing, and two
# processes that disagree announce it immediately rather than producing quietly wrong output
# (Open Issue 007 sub-decision 8d).
#
# What belongs here: domain parameters every process must agree on.
# What does NOT belong here: where this process finds Redis or PostgreSQL, and secrets. Those
# differ between a laptop, CI and production while the *configuration* is identical — putting
# them here would make the hash change when nothing about the configuration had, which destroys
# the only thing the hash is for. They come from the environment; see config/settings.py.
#
# Every value below is traceable to a decision in open-issues/. Do not add one that is not.

[exchange]
# Virtual capital granted to a new account, in int64 ticks. Decided 2026-08-31 during Task 1.3;
# the plan and the 19 open issues never named a figure.
#
# **Resized 2026-09-08, because Task 5.1 changed what a tick is worth.** The provisional symbol
# table was a pair of ~1,000-tick random walks, against which a 1,000,000 grant was a thousand
# lots. 5.1 replaced it with ten real instruments whose prices run to 8,208,718 ticks, and the
# grant was left behind — so it could not buy a single unit of six of the ten symbols, and the
# designated market makers reported `two_sided_uptime: 0.0` with `INSUFFICIENT_CASH` on every
# bid. They can only ever sell, because the maker exemption is from the *inventory* check and
# not the cash one, so those books went one-sided and inventory drifted negative: exactly the
# failure Open Issue 005 section 5e says a designated market maker exists to prevent.
#
# Ten billion is sized off the dataset's peak price rather than chosen round:
#
#     peak in the pinned history   8,208,718 ticks (QAA)
#     one full quote_size=100 quote  820,871,800 ticks
#     this grant                  12 such quotes, or 1,218 single units
#
# Twelve full quotes is the headroom a maker needs to requote continuously while holding
# inventory, and it leaves a human demo account able to trade every one of the ten symbols.
#
# Changing this is a truncate-and-restart, not a hot edit: the amount is stamped onto
# `AccountCreated` by the matcher as it forwards, so accounts already on the stream keep the
# grant they were opened with. `docker compose down -v`.
initial_cash_ticks = 10_000_000_000

[session]
# Open Issue 015: Redis-backed session cookies, no JWT.
ttl_seconds = 43200          # 12 hours
cookie_name = "qa_session"
cookie_samesite = "strict"

[limits]
# Open Issue 015 section 11.1: a single tier of 1000 orders/sec for all accounts, replacing the
# two-tier proposal. Recorded there is the consequence — with one tier this is no longer
# denial-of-service protection, it is exchange realism.
max_orders_per_second = 1000

# Task 3.1: a market order is a marketable limit order with a price band. 500 bps = 5%, the
# figure named in the task ("a market buy becomes a limit buy at best_ask x 1.05"). It is the
# only thing standing between a market order and a thin book, so it is configuration, not a
# constant. A per-symbol band belongs with the symbol table in Task 5.1.
market_order_band_bps = 500

[market_data]
# Open Issue 006: 20 Hz conflation, complete L2 snapshots, ten levels per side.
conflation_hz = 20
book_depth = 10

# OHLCV bar widths, in seconds of **stream time** — the `timestamp_ns` the gateway stamped on
# the order, not the wall clock of whoever is reading.
#
# SETTLED AT TASK 5.1, which is what this line was left in configuration for.
#
# The question was whether "a one-minute bar" means one real minute or one simulated minute,
# which under the replay clock is one real second. **`bars:*:1m` on the browser wire means one
# SIMULATED minute** — one real second, the first width below. That is the minute the *market*
# experiences: at 1 real second : 1 simulated minute a real minute contains sixty simulated
# minutes of price action, so a chart drawn on real minutes would compress an hour of market
# history into one candle and show almost nothing moving.
#
# Both widths are kept. The 60-second bucket is one simulated *hour* and is what the backtester
# (7.1) uses for a coarser series; the 1-second bucket is what the trading screen charts. The
# aggregation code is unchanged either way — settling this was always a matter of choosing the
# widths and saying which one the wire's "1m" refers to.
#
# **These widths are real seconds; the CHANNEL NAMES they are published under are simulated
# time.** `services/fanout/messages.py` `width_label` divides by the ratio below, so at 1:1 the
# widths here appear on the wire as:
#
#     1 second  → `bars:<SYMBOL>:1m`     one simulated minute — the trading screen's chart
#     60 seconds → `bars:<SYMBOL>:1h`    one simulated hour   — the backtester's coarser series
#
# Labelling them by literal seconds instead — which is what the code did until this was caught
# in review — put `1m` on the 60-second bucket, so the chart drew one candle per *real* minute:
# exactly the compression the paragraph above says must not happen.
bar_bucket_seconds = [1, 60]

[replay]
# Open Issue 005 sub-decision 5g: one real second maps to one simulated minute, so a demo shows
# a trading day rather than a quiet minute.
#
# Stamped into the *stream* as well, which is Task 5.1's second success criterion. **Done**:
# Amendment 2 added `ConfigureReplay` (type 5) and `ReplayConfigured` (type 17) and bumped
# `schema_version` to 2, and the gateway writes one at startup — so it is the first record on
# every session's inbound stream. The same record carries `config_hash_hi`/`config_hash_lo`,
# which also closes the 2026-08-31 decision "config hash to the log in 1.4, and to the stream
# in 2.1" that was never implemented at the time.
#
# Changing this value is a truncate-and-restart, like any change to this file, but with a sharper
# edge: the ratio is now stamped into the retained stream, so a session recorded under one ratio
# says so for ever. `docker compose down -v`.
real_seconds_per_simulated_minute = 1

# The pinned dataset, by content. **Which** prices the market replays is a domain parameter every
# process must agree on, so its identity belongs in this hashed file; *where the file sits* is
# infrastructure and stays a constant in `services/bots/fairvalue.py`. One source of truth, so
# there is nothing for a second copy to drift from.
#
# Produced by `python scripts/fetch_market_history.py`, which prints this line rather than
# writing it: a script that edited the hashed configuration would change every process's
# config_hash as a side effect of a fetch, and "did the configuration change?" is the one
# question that hash exists to answer.
#
# Changing it is changing the market. Ten instruments of real one-minute crypto history, seven
# days each — 10,080 minutes, which at the ratio above is about 2.8 hours before the loop wraps.
data_sha256 = "7e25a04501f6ea306e5119d6cce14ea12ad928b1eff411784a1ab579e0a1fd09"

[checkpoint]
# Open Issue 020. Every process that rebuilds by replay saves its state and the stream ids it
# reflects; a restart replays only the tail. Streams are trimmed below the oldest checkpoint among
# their readers — never by a fixed MAXLEN, which is what let a restart replay a partial history
# and fork the engine on 2026-09-16. A reader that has never checkpointed pins its stream
# untrimmed.
interval_ms = 30000
trim_interval_ms = 10000
# Every process that reads each stream and must be able to resume. A process added here that
# never writes a checkpoint stops trimming entirely, which is the safe failure.
inbound_readers = ["matcher"]
outbound_readers = ["matcher", "gateway", "ledger", "fanout", "archiver"]

[streams]
# The durable ordered log. Open Issue 003: Redis Streams, and the stream ID *is* the sequence
# number — never a parallel counter.
inbound = "qa.inbound"
outbound = "qa.outbound"


# Group commit. The producer drains everything queued while the previous flush was in flight and
# writes it as one pipeline, so `appendfsync always` costs one fsync per batch rather than one
# per order (Open Issue 003 section 8.2).
batch_max = 256

# How often the halt watchdog pings Redis. Success Criterion 5 requires the halt to clear
# without a gateway restart, so this cannot be a flag set once on failure.
health_poll_ms = 500

[idempotency]
# Open Issue 008: idempotency key TTL. A client can retry a request within this window and get
# the same answer. One hour allows for persistent WiFi or browser tab closures; longer than a
# session is rarely needed.
ttl_seconds = 3600

[bots]
# Designated market makers, by username. Open Issue 005 section 10.6 confirmed the structure:
# retail accounts are cash accounts and may never hold a negative position (Open Issue 004
# section 5, invariant 2), while a designated market maker is permitted negative inventory in
# exchange for quoting obligations. That is not a simplification away from reality — it is the
# real-world arrangement, with margin accounts deferred to a later phase.
#
# An explicit list of names, and deliberately not a prefix rule like `dmm_*`. A pattern would
# let anyone register `dmm_whatever` and grant themselves the exemption; a list cannot be
# joined by registering.
#
# It lives here rather than in a database column or an admin endpoint for three reasons: the
# REST surface is closed (Open Issue 016 section 10), configuration is version controlled and
# hashed into every process's startup line so the grant is auditable and reproducible, and one
# source of truth cannot drift from a second copy.
#
# Removing a name is safe in one direction only. An account that already holds negative
# inventory becomes retail on the next restart, and can then only buy back — `available` is
# already below zero, so no further sell passes the check. It heals rather than compounding.
#
# Task 4.4 creates one market maker per symbol; 5.1 grew the list with the symbol table.
designated_market_maker_accounts = [
  "dmm_qaa", "dmm_qab", "dmm_qac", "dmm_qad", "dmm_qae",
  "dmm_qaf", "dmm_qag", "dmm_qah", "dmm_qai", "dmm_qaj",
]

# The master seed. Every bot derives its own from this plus its name, so the whole session is
# reproducible from one number (Open Issue 005 sub-decision 5d). Determinism here is a property
# of **replaying the log**, not of reproducing a live session: bots run in real time and
# interleave non-deterministically, and the log captures whichever sequence actually occurred.
seed = 20260904

# Quoting. `half_spread_bps` is measured against fair value, so the spread scales with price
# rather than being a tick count that means something different on every symbol.
quote_hz = 2
half_spread_bps = 25
quote_size = 100

# The inventory skew: how far the quoted mid moves, in basis points of fair value, per one
# full `quote_size` of inventory held. This is the single most important parameter in the file
# (Open Issue 005 sub-decision 5b): a market maker that quotes symmetrically regardless of
# position accumulates unbounded one-sided inventory and stops being able to quote at all.
# Skewing against inventory is what real market makers do, and it is what keeps the simulation
# stable over hours rather than minutes.
#
# Set equal to `half_spread_bps`, so one full fill moves the mid by half a spread — enough to
# bias the next trade toward flattening, not enough to jump the market. Expressed in bps of
# fair value rather than ticks per unit so that it means the same thing on every symbol and
# does not change meaning when `quote_size` changes.
inventory_skew_bps = 25

# How often a bot re-reads its own position and resting orders. Until Task 5.2b there is no
# private stream, so this is REST polling; when the stream lands it replaces the poller and
# this value goes away.
poll_interval_ms = 500

# The synthetic fair-value process — a seeded random walk, replaced in Task 5.1 by replayed
# crypto history (Open Issue 005 section 10.2 keeps this generator afterwards, for tests and
# offline development). Parameters are fixed **before** any demonstration strategy is written:
# tuning the market until a chosen strategy profits is curve-fitting one's own universe
# (Open Issue 005 section 6).
fair_value_start_ticks = 1_000
fair_value_volatility_ticks = 2

[bots.obligations]
# What makes the bot a *designated* market maker rather than an unconstrained quoting loop
# (Open Issue 005 sub-decision 5h). Measured every quote tick; a breach is a recorded event,
# not a subjective judgement. These also become market-quality metrics for the Task 7.4
# benchmark report, where spread, depth and uptime under load say more than throughput alone.
max_spread_bps = 50
min_quote_size = 100
min_two_sided_uptime = 0.95

[bots.noise]
# Poisson arrivals. Noise traders are retail accounts, so they may only sell what they hold —
# which makes the market maker's short inventory the exact mirror of theirs, and keeps
# quantity conservation (Open Issue 004 section 5, invariant 4) true by construction.
count_per_symbol = 3
arrivals_per_second = 0.5
min_qty = 1
max_qty = 10

[symbols]
# The ten listed instruments. Task 5.1 replaced the provisional QAA/QAB pair wholesale.
#
# Each maps to one real crypto instrument's price history, replayed from the pinned Parquet.
# The mapping lives in `scripts/fetch_market_history.py`; the data file itself carries no
# instrument name and no timestamp, so a row cannot be joined back to a moment in the real
# market without re-running the script. That is what "anonymised historical data" means here,
# and the README says it in those terms.
#
# The names stay deliberately meaningless, for the reason the provisional block gave: Open Issue
# 005 section 10 and Task 5.1's Boundaries both forbid naming a symbol after a real instrument,
# and a placeholder that reads like a real ticker is the one most likely to survive into the
# demonstration by accident. QAA-QAJ says "this is a simulation" on sight.
#
# `tick_size_ticks` is the divisor the presentation layer applies for display, and it is the
# real increment of the instrument behind each symbol rather than a round number: 100 means two
# decimal places, 100_000 means five. Ten different values is the point. A table where every
# tick size was 1 would assert that all ten trade on the same scale, which is precisely what
# made the two-symbol block provisional.
#
# `symbol_id` 1 and 2 keep the names they had, but NOT the price scale — QAA was a 1,000-tick
# random walk and is now a ~7,900,000-tick replay. Changing this block is a truncate-and-restart,
# never a hot edit: every resting order, position and bar on the old stream is denominated in the
# old scale. `docker compose down -v`.

[[symbols.listed]]
symbol_id = 1
name = "QAA"
tick_size_ticks = 100
lot_size = 1

[[symbols.listed]]
symbol_id = 2
name = "QAB"
tick_size_ticks = 100
lot_size = 1

[[symbols.listed]]
symbol_id = 3
name = "QAC"
tick_size_ticks = 100
lot_size = 1

[[symbols.listed]]
symbol_id = 4
name = "QAD"
tick_size_ticks = 100
lot_size = 1

[[symbols.listed]]
symbol_id = 5
name = "QAE"
tick_size_ticks = 10_000
lot_size = 10

[[symbols.listed]]
symbol_id = 6
name = "QAF"
tick_size_ticks = 10_000
lot_size = 10

[[symbols.listed]]
symbol_id = 7
name = "QAG"
tick_size_ticks = 100_000
lot_size = 100

[[symbols.listed]]
symbol_id = 8
name = "QAH"
tick_size_ticks = 1_000
lot_size = 1

[[symbols.listed]]
symbol_id = 9
